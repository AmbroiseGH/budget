<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Maxilla</title>
  <meta name="description" content="Jaw training, eye area, cardio et lifestyle : ton programme glow-up, avec séries, niveaux et défi 6 mois.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Maxilla">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#05060a">
  <meta name="color-scheme" content="dark">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/unbounded-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/jakarta-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="aurore" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- ============ Aujourd'hui ============ -->
  <main id="vue-jour" class="vue active" aria-label="Aujourd'hui">
    <header class="barre">
      <div class="marque">
        <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg-logo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b59cff"/><stop offset=".55" stop-color="#6f8dff"/><stop offset="1" stop-color="#5ff0ff"/></linearGradient></defs><path d="M17 12 L22 45 L50 31 L53 23" fill="none" stroke="url(#lg-logo)" stroke-width="7.5" stroke-linejoin="miter" stroke-linecap="square" stroke-miterlimit="8"/></svg>
        <span class="mot">MAXILLA</span>
      </div>
      <button id="chip-serie" class="chip-serie" aria-label="Série"><span class="flamme">🔥</span><b id="serie-tete">0</b></button>
    </header>
    <p id="date" class="date"></p>

    <section id="heros" class="heros" aria-label="Niveau"></section>

    <button id="bandeau" class="bandeau" aria-label="Lifestyle change : ouvrir l'onglet">
      <span class="bandeau-etiquette">LIFESTYLE</span>
      <span class="bandeau-fenetre"><span id="bandeau-piste" class="bandeau-piste"></span></span>
    </button>

    <section class="programme" aria-labelledby="titre-jour">
      <div class="prog-tete">
        <div class="nav-jour">
          <button id="jour-prec" class="rond" aria-label="Jour précédent"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
          <button id="titre-jour" class="titre-jour"></button>
          <button id="jour-suiv" class="rond" aria-label="Jour suivant"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
        <p class="prog-compte"><b id="compte-faits">0</b><span id="compte-total">/0</span></p>
      </div>
      <div id="segments" class="segments" aria-hidden="true"></div>
      <p id="prog-statut" class="prog-statut"></p>
      <div id="liste" class="liste"></div>
      <div id="hors" class="hors"></div>
    </section>
    <p class="aide">Touche un exercice pour le cocher. <span class="aide-ico">›</span> ouvre les consignes et la séance guidée.</p>

    <button id="coffre-attente" class="coffre-attente" hidden>
      <span class="coffre-mini" aria-hidden="true"></span>
      <span><b>Ton coffre t'attend</b><small>Journée parfaite : ouvre ta récompense</small></span>
    </button>

    <button id="objectif" class="objectif" hidden></button>

    <button id="mini-ls" class="mini-ls"></button>
  </main>

  <!-- ============ Défi ============ -->
  <main id="vue-defi" class="vue" aria-label="Défi 6 mois" hidden></main>

  <!-- ============ Lifestyle ============ -->
  <main id="vue-lifestyle" class="vue" aria-label="Lifestyle change" hidden></main>

  <!-- ============ Progrès ============ -->
  <main id="vue-progres" class="vue" aria-label="Progrès" hidden></main>

  <!-- Barre d'onglets -->
  <nav class="onglets" aria-label="Onglets">
    <button data-vue="jour" class="actif" aria-current="page">
      <svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg><span>Aujourd'hui</span>
    </button>
    <button data-vue="defi">
      <svg viewBox="0 0 24 24"><path d="M3 18l6-6 4 4 8-9"/><path d="M15 7h6v6"/></svg><span>Défi</span>
    </button>
    <button data-vue="lifestyle">
      <svg viewBox="0 0 24 24"><path d="M5 19c0-8 5-13 15-14-1 10-6 15-14 15"/><path d="M5 19l7-7"/></svg><span>Lifestyle</span>
    </button>
    <button data-vue="progres">
      <svg viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 14v3M8 20h8M9 17h6"/></svg><span>Progrès</span>
    </button>
  </nav>

  <!-- Feuille du bas (consignes d'un exercice, réglages…) -->
  <div id="feuille" class="feuille" hidden>
    <div class="voile" data-fermer></div>
    <div id="feuille-panneau" class="panneau" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Célébrations (journée parfaite, coffre, niveau, trophée, cassure) -->
  <div id="fete" class="fete" hidden role="dialog" aria-modal="true">
    <div class="fete-fond"></div>
    <div id="fete-contenu" class="fete-contenu"></div>
  </div>

  <!-- Séance guidée -->
  <div id="coach" class="coach" hidden role="dialog" aria-modal="true" aria-labelledby="coach-titre">
    <div class="coach-tete">
      <button id="coach-fermer" class="rond verre" aria-label="Fermer la séance"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div>
        <p class="coach-sur">Séance guidée</p>
        <h2 id="coach-titre"></h2>
      </div>
    </div>
    <div class="coach-centre">
      <svg class="coach-anneau" viewBox="0 0 200 200" aria-hidden="true">
        <defs><linearGradient id="lg-coach" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b59cff"/><stop offset="1" stop-color="#5ff0ff"/></linearGradient></defs>
        <circle cx="100" cy="100" r="86" class="coach-fond-anneau"/>
        <circle id="coach-arc" cx="100" cy="100" r="86" class="coach-arc"/>
      </svg>
      <div class="coach-valeur"><span id="coach-gros">0</span><small id="coach-unite"></small></div>
    </div>
    <p id="coach-phase" class="coach-phase"></p>
    <p id="coach-consigne" class="coach-consigne"></p>
    <div id="coach-points" class="coach-points" aria-hidden="true"></div>
    <div class="coach-actions">
      <button id="coach-pause" class="bouton-verre">Pause</button>
      <button id="coach-action" class="bouton-feu" hidden>🔥 Brûlure !</button>
      <button id="coach-passer" class="bouton-verre">Passer</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="fichier" type="file" accept="application/json,.json" hidden>

  <script src="contenu.js"></script>
  <script src="sons.js"></script>
  <script src="sauvegarde.js" data-app="maxilla" data-nom="Maxilla" data-cle="maxilla.v1" data-requis="jours" data-unite="jour"></script>
  <script src="app.js"></script>
</body>
</html>
