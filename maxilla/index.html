  <!-- ============ Accueil ============ -->
  <main id="vue-jour" class="vue active" aria-label="Accueil">
    <header class="barre">
      <div class="marque"><svg class="logo" aria-hidden="true"><use href="#logo"/></svg><span class="mot">maxilla</span></div>
      <button id="bouton-fact" class="bouton-carre" aria-label="Le fun fact du jour">
        <svg class="ico" aria-hidden="true"><use href="#i-ampoule"/></svg><i id="point-fact" class="point" hidden></i>
      </button>
    </header>
    <h1 id="salut" class="salut">Bonjour</h1>
    <p id="devise" class="devise"></p>

    <button id="bandeau" class="bandeau" aria-label="Fun facts : ouvrir l'onglet Lifestyle">
      <span class="bandeau-etiquette"><svg class="ico" aria-hidden="true"><use href="#i-ampoule"/></svg>Fun fact</span>
      <span class="bandeau-fenetre"><span id="bandeau-piste" class="bandeau-piste"></span></span>
    </button>

    <section id="heros" class="heros" aria-label="Programme du jour"></section>
    <div id="stats" class="stats"></div>

    <section class="programme" aria-labelledby="titre-liste">
      <div class="prog-tete">
        <h2 id="titre-liste">Tes exercices</h2>
        <div class="nav-jour">
          <button id="jour-prec" class="rond" aria-label="Jour précédent"><svg class="ico" aria-hidden="true"><use href="#i-retour"/></svg></button>
          <button id="titre-jour" class="titre-jour"></button>
          <button id="jour-suiv" class="rond" aria-label="Jour suivant"><svg class="ico" aria-hidden="true"><use href="#i-chevron"/></svg></button>
        </div>
      </div>
      <div id="liste" class="liste"></div>
      <p id="hors" class="hors"></p>
    </section>
  </main>

  <!-- ============ Défi ============ -->
  <main id="vue-defi" class="vue" aria-label="Défi 180 jours" hidden></main>

  <!-- ============ Lifestyle ============ -->
  <main id="vue-lifestyle" class="vue" aria-label="Lifestyle" hidden></main>

  <!-- ============ Progrès ============ -->
  <main id="vue-progres" class="vue" aria-label="Progrès" hidden></main>

  <!-- Barre d'onglets -->
  <nav class="onglets" aria-label="Onglets">
    <button data-vue="jour" class="actif" aria-current="page"><svg class="ico" aria-hidden="true"><use href="#i-maison"/></svg><span>Accueil</span></button>
    <button data-vue="defi"><svg class="ico" aria-hidden="true"><use href="#i-courbe"/></svg><span>Défi</span></button>
    <button data-vue="lifestyle"><svg class="ico" aria-hidden="true"><use href="#i-etincelles"/></svg><span>Lifestyle</span></button>
    <button data-vue="progres"><svg class="ico" aria-hidden="true"><use href="#i-barres"/></svg><span>Progrès</span></button>
  </nav>

  <!-- Feuille du bas (consignes d'un exercice, fun fact…) -->
  <div id="feuille" class="feuille" hidden>
    <div class="voile" data-fermer></div>
    <div id="feuille-panneau" class="panneau" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Célébrations (journée parfaite, jalon, défi signé, courbe cassée) -->
  <div id="fete" class="fete" hidden role="dialog" aria-modal="true">
    <div class="fete-fond"></div>
    <div id="fete-contenu" class="fete-contenu"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="fichier" type="file" accept="application/json,.json" hidden>

  <script src="contenu.js"></script>
  <script src="sons.js"></script>
  <script src="sauvegarde.js" data-app="maxilla" data-nom="Maxilla" data-cle="maxilla.v1" data-requis="jours" data-unite="jour"></script>
  <script src="app.js"></script>
</body>
</html>
